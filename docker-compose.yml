name: quality-system
x-quality: &quality
  image: ${QUALITY_IMAGE:-quality-system:local}
  build: .
  init: true
  environment: &quality-env
    Quality__Api__Key: ${QUALITY_API_KEY:-}
    Quality__Api__AllowAnonymous: ${QUALITY_API_ALLOW_ANONYMOUS:-false}
    Quality__Store: Postgres
    Quality__Retry__MaxWorkerAttempts: ${QUALITY_RETRY_MAX_WORKER_ATTEMPTS:-5}
    Quality__Retry__MaxNormalizationAttempts: ${QUALITY_RETRY_MAX_NORMALIZATION_ATTEMPTS:-3}
    Quality__Retry__MaxDurationSeconds: ${QUALITY_RETRY_MAX_DURATION_SECONDS:-900}
    Quality__Retry__InitialDelayMilliseconds: ${QUALITY_RETRY_INITIAL_DELAY_MILLISECONDS:-250}
    Quality__Retry__MaxDelayMilliseconds: ${QUALITY_RETRY_MAX_DELAY_MILLISECONDS:-5000}
    Quality__Lease__DurationSeconds: ${QUALITY_LEASE_DURATION_SECONDS:-300}
    Quality__Lease__RenewalIntervalSeconds: ${QUALITY_LEASE_RENEWAL_INTERVAL_SECONDS:-60}
    Quality__Lease__RenewalTimeoutSeconds: ${QUALITY_LEASE_RENEWAL_TIMEOUT_SECONDS:-15}
    Quality__Lease__CancellationPollIntervalSeconds: ${QUALITY_LEASE_CANCELLATION_POLL_INTERVAL_SECONDS:-1}
    Quality__SourceControl__Workspace: /app
    Quality__SourceControl__ProposalDirectory: /data/executions/proposals
    Quality__Artifacts__Mode: ${QUALITY_ARTIFACTS_MODE:-Local}
    Quality__Artifacts__Endpoint: http://minio:9000
    Quality__Artifacts__Bucket: ${QUALITY_ARTIFACTS_BUCKET:-quality-artifacts}
    Quality__Artifacts__AccessKey: ${MINIO_ROOT_USER:-quality-local}
    Quality__Artifacts__SecretKey: ${MINIO_ROOT_PASSWORD:-quality-local-only}
    Quality__Artifacts__RetentionDays: ${QUALITY_ARTIFACTS_RETENTION_DAYS:-30}
    Quality__Execution__Workspace: /app
    Quality__Execution__RunDirectory: /data/executions
    Quality__Execution__AllowedOrigins: ${QUALITY_EXECUTION_ALLOWED_ORIGINS:-}
    Quality__Requirements__Mode: ${QUALITY_REQUIREMENTS_MODE:-Stub}
    Quality__Requirements__Jira__BaseUrl: ${JIRA_BASE_URL:-}
    Quality__Requirements__Jira__Email: ${JIRA_EMAIL:-}
    Quality__Requirements__Jira__Token: ${JIRA_TOKEN:-}
    Quality__Requirements__Jira__AcceptanceField: ${JIRA_ACCEPTANCE_FIELD:-}
    Quality__Requirements__Coda__Token: ${CODA_TOKEN:-}
    Quality__Requirements__Coda__TitleColumn: ${CODA_TITLE_COLUMN:-}
    Quality__Requirements__Coda__DescriptionColumn: ${CODA_DESCRIPTION_COLUMN:-}
    Quality__Requirements__Coda__AcceptanceColumn: ${CODA_ACCEPTANCE_COLUMN:-}
    Quality__Planning__Mode: ${QUALITY_PLANNING_MODE:-Stub}
    Quality__Planning__Model: ${QUALITY_PLANNING_MODEL:-}
    Quality__Planning__ApiKey: ${OPENAI_API_KEY:-}
    ConnectionStrings__Quality: Host=postgres;Database=quality;Username=quality;Password=${POSTGRES_PASSWORD:-quality-local-only}
  depends_on:
    postgres:
      condition: service_healthy
  volumes: ["execution-data:/data/executions"]
  read_only: true
  tmpfs:
    - /tmp:mode=1777
  shm_size: 1gb

services:
  api:
    <<: *quality
    command: ["api"]
    ports: ["127.0.0.1:5080:8080"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
  worker:
    <<: *quality
    command: ["worker"]
    environment:
      <<: *quality-env
      Quality__Metrics__WorkerUrl: ${QUALITY_METRICS_WORKER_URL:-}
  oneshot:
    <<: *quality
    profiles: ["cli"]
    command: ["run", "--source", "jira", "--reference", "AUTH-1427"]
  smoke:
    <<: *quality
    profiles: ["test"]
    entrypoint: ["npm", "test"]
    command: []
    environment:
      QUALITY_API_KEY: ${QUALITY_API_KEY:-}
      QUALITY_BASE_URL: http://api:8080
      QUALITY_ARTIFACT_DIR: /tmp/quality-artifacts
      npm_config_cache: /tmp/npm
    depends_on:
      api:
        condition: service_healthy
  postgres:
    image: postgres:16.6-bookworm
    environment:
      POSTGRES_DB: quality
      POSTGRES_USER: quality
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quality-local-only}
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quality -d quality"]
      interval: 3s
      timeout: 3s
      retries: 20
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-quality-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-quality-local-only}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  execution-data:
  postgres-data:
  minio-data:
